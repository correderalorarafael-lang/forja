<style>
:root{--bg:#10101B;--card:#19192A;--line:#2B2B43;--txt:#F0EFFF;--mut:#9695B2;--acc:#B79AFF;--on-acc:#1A1230;--ok:#66DCC0;--bad:#FF7B95}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;height:100vh;height:100dvh}
header{flex:none;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0}h2{font-size:18px;margin:20px 0 8px}
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:12px max(16px,calc((100% - 608px) / 2)) 120px}

.btn{background:var(--acc);color:var(--on-acc);border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}

.btn.sm{padding:8px 12px;font-size:14px}.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn:disabled{opacity:.4}
.icon{background:none;border:0;color:var(--mut);font-size:20px;padding:6px 10px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.tap{cursor:pointer}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}
.muted{color:var(--mut);margin:6px 0}small{color:var(--mut)}
.stats{display:flex;gap:12px}.stats>div{flex:1;display:flex;flex-direction:column}.stats b{font-size:18px}
.mini{display:flex;gap:14px;color:var(--mut);font-size:14px;margin-top:4px}
.title-in{width:100%;background:none;border:0;font-size:20px;font-weight:700;margin-bottom:10px;padding:0}
.exname{color:var(--acc);cursor:pointer}

.grip{color:var(--mut);font-size:18px;line-height:1}
.thumb{width:40px;height:40px;border-radius:50%;object-fit:cover;background:var(--line);flex:none;border:1px solid var(--line)}
.thumb.ph{display:inline-grid;place-items:center;background:var(--line);color:var(--txt);font-weight:700}
.exrows{display:flex;flex-direction:column;gap:8px;margin-top:10px;font-size:15px}
.bars{display:flex;flex-direction:column;gap:8px;margin:12px 0 8px}

#wheel{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}#wheel[hidden]{display:none}
#wheel .in{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:22px 22px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));text-align:center;animation:sheetup .3s cubic-bezier(.2,.9,.25,1)}
@keyframes sheetup{from{transform:translateY(100%)}}
.handle{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.wheel{position:relative;height:220px;margin:14px 0 8px;perspective:500px}
.wsel{position:absolute;left:0;right:0;top:88px;height:44px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.wlist{position:relative;height:220px;overflow-y:scroll;scroll-snap-type:y mandatory;padding:88px 0;scrollbar-width:none;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent)}

.wi.on{color:var(--acc);font-weight:700}
.sh,.set{display:grid;grid-template-columns:32px minmax(0,1fr) 58px 50px 38px 40px;gap:5px;align-items:center;text-align:center}
.prev{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.dots{font-size:24px;line-height:1;padding:4px 10px}

#menu{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}#menu[hidden]{display:none}

#ask .ask-error{display:block;color:var(--bad);font-size:12px;margin:-10px 0 12px}#ask .ask-error[hidden]{display:none}

#ask .ask-actions .btn.danger{background:var(--bad);color:#32131c;border:0}

#ask.closing .in{animation:panel-out .22s cubic-bezier(.4,0,1,1) forwards}
@keyframes ask-in{from{transform:translateY(48px) scale(.985);opacity:0}}
@media(min-width:640px){#ask{align-items:center;padding:20px}#ask .in{border:1px solid rgba(183,154,255,.2);border-radius:26px;padding:18px 24px 24px;animation:ask-pop .28s cubic-bezier(.2,.85,.24,1)}#ask .handle{display:none}#ask.closing .in{animation:ask-out .18s ease-in forwards}}
@keyframes ask-pop{from{transform:translateY(12px) scale(.98);opacity:0}}
@keyframes ask-out{to{transform:translateY(8px) scale(.985);opacity:0}}
#menu .in{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:22px 22px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));animation:sheetup .3s cubic-bezier(.2,.9,.25,1);max-height:85vh;overflow-y:auto}

.ring{width:48px;height:48px;transform:rotate(-90deg);flex:none}.ring circle{fill:none;stroke-width:4.5}

.rinfo{flex:1;display:flex;flex-direction:column;line-height:1.1}

/* iOS: con el teclado abierto lo fijado abajo flota a media pantalla; se oculta la barra y el descanso sube */

/* --- transiciones entre pantallas --- */
::view-transition-group(root){animation-duration:.32s;animation-timing-function:cubic-bezier(.22,.8,.24,1)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.32s;animation-timing-function:cubic-bezier(.22,.8,.24,1);mix-blend-mode:normal}
html[data-nav=fwd]::view-transition-old(root){animation-name:vt-sale-izq}
html[data-nav=fwd]::view-transition-new(root){animation-name:vt-entra-der}
html[data-nav=back]::view-transition-old(root){animation-name:vt-sale-der}
html[data-nav=back]::view-transition-new(root){animation-name:vt-entra-izq}
html[data-nav=fade]::view-transition-old(root){animation:.18s ease-out both vt-desvanece}
html[data-nav=fade]::view-transition-new(root){animation:.26s cubic-bezier(.22,.8,.24,1) both vt-aparece}
html[data-nav=soft]::view-transition-old(root){animation:.2s ease-out both vt-desvanece}
html[data-nav=soft]::view-transition-new(root){animation:.2s ease-out both vt-funde}
@keyframes vt-funde{from{opacity:0}}
/* paneles inferiores: entran y salen deslizando, con el fondo fundido */
#menu:not([hidden]),#wheel:not([hidden]),#sheet:not([hidden]){animation:fondo-in .25s ease-out}
@keyframes fondo-in{from{background:rgba(0,0,0,0)}}
#menu.closing,#wheel.closing,#sheet.closing{animation:fondo-out .22s ease-in forwards}
@keyframes fondo-out{to{background:rgba(0,0,0,0)}}
#menu.closing .in,#wheel.closing .in,#sheet.closing .in{animation:panel-out .22s cubic-bezier(.4,0,1,1) forwards}
@keyframes panel-out{to{transform:translateY(100%)}}
/* lo recién añadido aparece; la serie completada se tiñe poco a poco */
.setwrap.fresh{animation:fila-in .28s cubic-bezier(.22,.8,.24,1)}
@keyframes fila-in{from{opacity:0;transform:translateY(-8px)}}
.card.fresh{animation:tarjeta-in .32s cubic-bezier(.22,.8,.24,1)}
@keyframes tarjeta-in{from{opacity:0;transform:translateY(16px) scale(.98)}}
.set.done.justdone{animation:hecho .45s ease-out}
@keyframes hecho{from{background:var(--card)}}
.noterow.fresh{animation:fila-in .25s ease-out}
::view-transition-old(cabecera),::view-transition-new(cabecera){animation-duration:.2s}
@keyframes vt-entra-der{from{transform:translateX(100%)}}
@keyframes vt-sale-izq{to{transform:translateX(-28%);opacity:.6}}
@keyframes vt-entra-izq{from{transform:translateX(-28%);opacity:.6}}
@keyframes vt-sale-der{to{transform:translateX(100%)}}
@keyframes vt-desvanece{to{opacity:0}}
@keyframes vt-aparece{from{opacity:0;transform:translateY(10px)}}
#view.enter-fwd{animation:entra-der .34s cubic-bezier(.22,.8,.24,1)}
#view.enter-back{animation:entra-izq .34s cubic-bezier(.22,.8,.24,1)}
#view.enter-fade{animation:vt-aparece .28s cubic-bezier(.22,.8,.24,1)}
#view.enter-soft{animation:suave .22s ease-out}
@keyframes entra-der{from{transform:translateX(38%);opacity:0}}
@keyframes entra-izq{from{transform:translateX(-26%);opacity:0}}
@keyframes suave{from{opacity:.35}}
/* respuesta al pulsar */
button,.tap{transition:transform .14s cubic-bezier(.3,.7,.4,1),background-color .2s,opacity .2s}
button:active:not(:disabled),.tap:active{transform:scale(.97)}
.btn:active:not(:disabled){opacity:.88}
.card{transition:border-color .22s ease,box-shadow .22s ease,background-color .22s ease}
@media(hover:hover){.card.tap:hover,.routine-card:hover{border-color:rgba(183,154,255,.3);box-shadow:0 10px 28px rgba(0,0,0,.16)}.btn:not(:disabled):hover{transform:translateY(-1px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

const RESTS = Array.from({ length: 41 }, (_, i) => i * 15); // 0 a 10 min, de 15 en 15 s
const RING = 119.38; // perímetro del anillo de descanso (2π·19)
const TABS = ['inicio','entreno','perfil','ajustes'];
// Iconos originales de FORJA: una sola familia SVG, trazo uniforme y sin glifos del sistema.
const ICONS = {

  timer: '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6M12 5V3"/>',
  trash: '<path d="M4 7h16M10 11v6m4-6v6M5 7l1 14h12l1-14M9 7V4h6v3"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  warm: '<path d="M12 22c4 0 7-2.8 7-6.5 0-2.4-1.4-4.5-3.4-6.1.2 2-1.2 3-2.5 3.5.3-4-1.6-7-4.7-9.9.4 3.7-1.1 5.5-2.6 7.5C4.5 10.2 5 12.3 5 15.5 5 19.2 8 22 12 22Z"/>',
  weight: '<path d="M3 9v6m3-9v12m12-12v12m3-9v6M6 12h12"/><path d="M8 8v8m8-8v8"/>',
  bars: '<path d="M4 19V9m5 10V5m6 14v-7m5 7V3"/>',
  duplicate: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/>',
  exercise: '<path d="M4 7v10m4-13v16m8-16v16m4-13v10M8 12h8"/>',
  swap: '<path d="M16 3l4 4-4 4M4 7h16M8 21l-4-4 4-4m12 4H4"/>',
  down: '<path d="M12 4v16m-7-7 7 7 7-7"/>',
  up: '<path d="M12 20V4m-7 7 7-7 7 7"/>',

};
const uiIcon = (name, cls = 'ui-icon') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ICONS.star}</svg>`;
const SET_TYPES = ['', 'w', 'f', 'd']; // normal, calentamiento, fallo, drop set
const work = sets => sets.filter(s => s.t !== 'w'); // las de calentamiento no cuentan para récords
// Progresión doble: siempre entre 8 y 12 reps. Si en la última sesión todas las series de trabajo llegaron a 12,
// se sube peso y se vuelve a 8; si no, mismo peso y +1 rep por serie.
const REP_MIN = 8, REP_MAX = 12;
const stepKg = exId => /mancuerna/i.test(ex(exId).name) ? 2 : 2.5;
function progression(exId) {
  const last = work(prevSets(exId));
  if (!last.length) return null;
  const kg = Math.max(...last.map(s => +s.kg || 0)), top = last.filter(s => (+s.kg || 0) === kg);
  if (kg > 0 && top.every(s => s.reps >= REP_MAX)) {
    const next = kg + stepKg(exId);
    return { up: true, kg: next, msg: `${uiIcon('up')} Sube peso: ${fmt(next)} kg × ${REP_MIN} (la última vez hiciste ${REP_MAX} en todas)` };
  }
  return { up: false, kg, msg: `${uiIcon('target')} ${last.every(s => s.reps >= REP_MIN)
    ? `Mantén ${fmt(kg)} kg y suma 1 rep por serie (hasta ${REP_MAX})`
    : `Mantén ${fmt(kg)} kg hasta hacer ${REP_MIN}–${REP_MAX} en todas`}` };
}
// Sugerencia para la serie j del ejercicio (null en calentamiento o sin historial).
function suggest(it, j) {
  if (it.sets[j].t === 'w') return null;
  const pr = progression(it.exId); if (!pr) return null;
  const last = work(prevSets(it.exId)), k = work(it.sets.slice(0, j)).length, ref = last[Math.min(k, last.length - 1)];
  if (pr.up) return { kg: pr.kg, reps: REP_MIN };
  return { kg: +ref.kg || 0, reps: Math.min(REP_MAX, ref.reps >= REP_MIN ? ref.reps + 1 : REP_MIN) };
}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const pad = n => String(n).padStart(2, '0');
const clock = sec => { sec = Math.max(0, Math.floor(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s = sec % 60; return h ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`; };
const fmt = n => String(Math.round(n * 10) / 10).replace('.', ',');
const fmtKg = n => Math.round(n).toLocaleString('es') + ' kg';
const fdate = t => new Date(t).toLocaleDateString('es', { weekday: 'short', day: 'numeric', month: 'short' });
const fdur = ms => { const m = Math.round(ms / 60000); return m >= 60 ? `${Math.floor(m / 60)}h ${pad(m % 60)}m` : `${m}m`; };

// --- datos (solo en este dispositivo) ---
const KEY = 'forja-v1';
const defaults = () => ({ custom: [], routines: [], workouts: [], active: null, rest: 90, alias: {}, notes: {}, body: [], folders: [], profile: { name: '', photo: '' }, deleted: {} });
// alias: nombre importado → id de ejercicio · notes: nota fija por ejercicio · body: [{ t, peso, grasa, cintura… }]
function load() {
  const raw = localStorage.getItem(KEY);
  if (!raw) return defaults();
  try { return { ...defaults(), ...JSON.parse(raw) }; }
  catch { localStorage.setItem(KEY + '-corrupto-' + Date.now(), raw); return defaults(); } // nunca pisar datos ilegibles
}
let S = load();
const save = () => { localStorage.setItem(KEY, JSON.stringify(S)); if (acct) syncSoon(); };
const gone = key => S.deleted[key] = Date.now(); // marca un borrado para la sincronización
let acct = (() => { try { return JSON.parse(localStorage.getItem('forja-cuenta')); } catch { return null; } })(); // { token, email, name, synced }
navigator.storage?.persist?.();

const allEx = () => [...LIB, ...S.custom];
const ex = id => allEx().find(e => e.id === id) || { id, name: '(ejercicio borrado)', muscle: '' };
const e1rm = s => s.reps === 1 ? s.kg : s.kg * (1 + s.reps / 30); // Epley
const vol = w => w.items.reduce((t, it) => t + it.sets.reduce((u, s) => u + (s.done === false ? 0 : (+s.kg || 0) * (+s.reps || 0)), 0), 0);
// Unilaterales: cada lado se apunta como una fila, así que 2 filas = 1 serie real (para series y reparto muscular).
const UNILATERAL = /unilateral|a una pierna|a un brazo|búlgara|bulgara|step up|bayesian|katana/i;
const sideFactor = exId => UNILATERAL.test(ex(exId).name) ? .5 : 1;
const nsets = w => w.items.reduce((t, it) => t + it.sets.filter(s => s.done !== false).length * sideFactor(it.exId), 0);
const prevSets = id => { for (const w of S.workouts) { const it = w.items.find(x => x.exId === id); if (it) return it.sets; } return []; };
const bestE1rm = id => Math.max(0, ...S.workouts.flatMap(w => w.items.filter(it => it.exId === id).flatMap(it => work(it.sets).map(e1rm))));
// Etiqueta de la serie: C/F/D o su número (sin contar las de calentamiento).
const setLabel = (sets, j) => ({ w: 'C', f: 'F', d: 'D' })[sets[j].t] || work(sets.slice(0, j + 1)).length;
// Superseries: ejercicios seguidos con el mismo `ss`. Letra A, B… por orden de aparición.
const ssLetter = (list, i) => String.fromCharCode(65 + [...new Set(list.map(x => x.ss).filter(Boolean))].indexOf(list[i].ss));
function linkSS(list, i) {
  const a = list[i], b = list[i + 1]; if (!b) return;
  if (a.ss && a.ss === b.ss) { const g = a.ss, n = uid(); for (let k = i + 1; list[k]?.ss === g; k++) list[k].ss = n; } // separar
  else { const g = a.ss || b.ss || uid(), old = b.ss; for (const x of list) if (old && x.ss === old) x.ss = g; a.ss = b.ss = g; }
  const count = {}; list.forEach(x => x.ss && (count[x.ss] = (count[x.ss] || 0) + 1));
  list.forEach(x => { if (x.ss && count[x.ss] < 2) delete x.ss; });
}

// --- navegación ---
// Al recargar se vuelve a la misma pantalla (sessionStorage dura mientras la app sigue abierta).
// Las pantallas que dependen de algo a medio hacer (editor, importaciones) vuelven a su pestaña.
const VIEW_KEY = 'forja-vista', VOLATILE = ['rutina', 'importar', 'importarHist'];
function savedView() {
  try { const v = JSON.parse(sessionStorage.getItem(VIEW_KEY)); if (v?.p && v.tab) return VOLATILE.includes(v.p) ? { p: v.tab, tab: v.tab } : v; } catch {}
  return null;
}
let V = savedView() || (S.active ? { p: 'entreno', tab: 'entreno' } : { p: 'inicio', tab: 'inicio' }), draft = null, picker = null;
const F = { lib: { q: '', m: '' }, pick: { q: '', m: '' } };
// Cambio de pantalla animado: 'fwd' entra desde la derecha, 'back' vuelve hacia la izquierda, 'fade' entre pestañas.
// Usa View Transitions (iOS 18+, Chrome); en navegadores sin ellas, una animación CSS del contenido.
const calm = matchMedia('(prefers-reduced-motion: reduce)');
function vt(kind, update) { // anima solo el contenido (#view): la cabecera y la barra de abajo no se tocan
  update();
  const v = $('#view'); v.classList.remove('enter-fwd', 'enter-back', 'enter-fade', 'enter-soft'); void v.offsetWidth; v.classList.add('enter-' + kind);
}
const smooth = update => vt('soft', update); // re-pinta la pantalla actual con un fundido suave
function navigate(kind, update) {
  if (calm.matches) kind = 'fade'; // con "Reducir movimiento": fundido en vez de deslizar
  vt(kind, update);
}
const backStack = []; // pantallas anteriores, para que "atrás" vuelva a la de antes y no a la pestaña
function go(p, extra = {}) {
  const sub = !TABS.includes(p);
  if (sub) { history.pushState(null, ''); backStack.push(V); } else backStack.length = 0;
  const kind = sub ? 'fwd' : TABS.includes(V.p) ? 'fade' : 'back';
  V = { p, tab: sub ? V.tab : p, ...extra };
  navigate(kind, () => { render(); $('#view').scrollTop = 0; });
}
addEventListener('popstate', () => { if (askResolve) finishAsk(); else if (menu) closeMenu(); else if (wheel) closeWheel(); else if (picker) { slideOut($('#sheet'), () => { picker = null; render(); if (pickedScroll) $('#view').scrollTo({ top: 1e9, behavior: 'smooth' }); pickedScroll = false; }); } else if (!TABS.includes(V.p)) { V = backStack.pop() || { p: V.tab, tab: V.tab }; navigate('back', () => { render(); $('#view').scrollTop = 0; }); } });

function render() {
  const pages = { inicio: pInicio, perfil: pPerfil, stats: pStats, calendario: pCalendario, entreno: pEntreno, ejercicios: pEjercicios, ajustes: pAjustes, rutina: pRutina, rutinaVer: pRutinaVer, importar: pImportar, importarHist: pImportarHist, cuerpo: pCuerpo, discos: pDiscos, workout: pWorkout, resumen: pResumen, ejercicio: pEjercicio };
  if (!pages[V.p]) V = { p: 'inicio', tab: 'inicio' }; // pantalla guardada que ya no existe
  const [title, html] = pages[V.p]();
  $('#title').textContent = title;
  $('#finishBtn').hidden = !(S.active && V.p === 'entreno');
  $('#view').innerHTML = html;
  document.querySelectorAll('nav button').forEach(b => { b.classList.toggle('on', b.dataset.tab === V.tab); b.setAttribute('aria-current', b.dataset.tab === V.tab ? 'page' : 'false'); });
  const ti = ['inicio', 'entreno', 'perfil'].indexOf(V.tab), pill = $('#navpill');
  pill.style.opacity = ti < 0 ? 0 : 1; if (ti >= 0) pill.style.transform = `translateX(${ti * 100}%)`; // directo: cambiar una variable CSS no anima; en Ajustes no se marca ninguna
  renderSheet(); tick();
  try { sessionStorage.setItem(VIEW_KEY, JSON.stringify(V)); } catch {}
  if ($('#gbtn')) mountGoogle();
  fresh = null; // las animaciones de "recién añadido" solo se aplican una vez
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 3000); }

// --- páginas ---
function pEntreno() {
  const a = S.active;
  if (!a) {
    const rCard = r => `<div class="card routine-card">
      <div class="routine-top"><span class="routine-icon" aria-hidden="true">${uiIcon('weight')}</span><b class="tap routine-name" data-a="viewRoutine" data-id="${r.id}">${esc(r.name)}</b>
        <button class="icon dots" data-a="routineMenu" data-id="${r.id}" aria-label="Opciones de la rutina">⋮</button></div>
      <p class="routine-meta tap clamp" data-a="viewRoutine" data-id="${r.id}">${r.items.length} ejercicios · ${esc(r.items.slice(0, 3).map(it => ex(it.exId).name).join(' · '))}${r.items.length > 3 ? ' · …' : ''}</p>
      <button class="btn" data-a="startRoutine" data-id="${r.id}">Empezar rutina <span aria-hidden="true">→</span></button></div>`;
    const loose = S.routines.filter(r => !S.folders.some(f => f.id === r.folder));
    return ['Entrenamiento', `
      <section class="home-hero training-hero"><div class="hero-copy"><small class="home-kicker">TU PRÓXIMA SESIÓN</small><h2>Entrena a tu manera.</h2><p>Retoma una rutina o empieza desde cero.</p>
        <button class="btn" data-a="startEmpty">+ Entreno libre</button></div></section>
      <div class="quick-actions"><button class="tile" data-a="newRoutine">${uiIcon('add')}<span>Nueva rutina</span></button><button class="tile" data-a="importStart">${uiIcon('down')}<span>Importar</span></button><button class="tile" data-a="newFolder">${uiIcon('folder')}<span>Carpeta</span></button></div>
      <div class="section-head"><h2>Mis rutinas</h2><small>${S.routines.length} en total</small></div>
      ${[...S.folders].sort((x, y) => !!y.on - !!x.on).map(f => { const rs = S.routines.filter(r => r.folder === f.id).sort((x, y) => (dayOf(x) + 8) % 8 - (dayOf(y) + 8) % 8); return `<div class="folder ${f.on ? 'isOn' : ''} ${fresh === `folder:${f.id}` ? 'fresh' : ''}">
        <div class="row between"><button class="fhead" data-a="folderToggle" data-id="${f.id}" aria-expanded="${!f.closed}">${f.closed ? '▸' : '▾'} ${esc(f.name)} <small>(${rs.length})</small>${f.on ? ` <span class="onbadge">${uiIcon('star')} Activo</span>` : ''}</button>
          <button class="icon dots" data-a="folderMenu" data-id="${f.id}" aria-label="Opciones de la carpeta">⋮</button></div>
        ${f.closed ? '' : rs.map(rCard).join('') || '<p class="muted">Carpeta vacía. Mueve rutinas aquí desde su menú ⋮.</p>'}</div>`; }).join('')}
      ${loose.length ? (S.folders.length ? `<div class="fhead">Mis rutinas <small>(${loose.length})</small></div>` : '') + loose.map(rCard).join('') : ''}
      ${S.routines.length ? '' : `<div class="home-empty"><span class="empty-mark" aria-hidden="true">${uiIcon('weight')}</span><div><b>Aún no tienes rutinas</b><p>Crea una, impórtala o guarda como rutina un entreno terminado.</p></div></div>`}`];
  }
  return ['Entreno en curso', `
    <div class="card">
      <input class="title-in" data-w="name" value="${esc(a.name)}" aria-label="Nombre del entreno">
      <div class="stats"><div><small>Duración</small><b id="elapsed"></b></div><div><small>Volumen</small><b id="vol">${fmtKg(vol(a))}</b></div><div><small>Series</small><b id="nsets">${fmt(nsets(a))}</b></div></div>
      ${setCount(a) ? `<div class="pbar big"><i style="width:${doneCount(a) / setCount(a) * 100}%"></i></div><small class="pbar-txt">${doneCount(a) === setCount(a) ? `${uiIcon('check')} Todas las series hechas · ¡a terminar!` : `${doneCount(a)} de ${setCount(a)} series · ${Math.round(doneCount(a) / setCount(a) * 100)} %`}</small>` : ''}
      <div class="row between" style="margin-top:10px"><small>${S.workouts.length < 5 ? 'Toca el nº de serie para cambiar su tipo. Desliza una serie a la izquierda para borrarla.' : ''}</small>
        <button class="btn ghost sm" data-a="openDiscos">${uiIcon('calculator')} Discos</button></div>
    </div>
    ${a.items.map(exCard).join('')}
    <button class="btn ghost wide" data-a="pick" data-mode="workout">+ Añadir ejercicio</button>
    `];
}
function exCard(it, i) {
  const prev = prevSets(it.exId);
  const e = ex(it.exId), list = S.active.items;
  const note = S.notes[it.exId] || '', prog = progression(it.exId), nd = it.sets.filter(s => s.done).length, complete = nd === it.sets.length && nd > 0;
  // récord en vivo: la mejor serie hecha de hoy si supera el mejor 1RM estimado del historial
  const best = bestE1rm(it.exId), top = it.sets.reduce((m, s, j) => s.done && s.t !== 'w' && +s.kg > 0 && e1rm({ kg: +s.kg, reps: +s.reps }) > (m < 0 ? best : e1rm({ kg: +it.sets[m].kg, reps: +it.sets[m].reps })) ? j : m, -1);
  const prJ = best > 0 ? top : -1;
  return `<div class="card excard ${it.ss ? 'ss' : ''} ${complete ? 'complete' : ''} ${fresh === 'ex:' + i ? 'fresh' : ''}">
    ${it.ss ? `<small class="sslabel">${uiIcon('link')} Superserie ${ssLetter(list, i)}</small>` : ''}
    <div class="row between ex-head" data-drag="workout" data-i="${i}">
      <b class="exname" data-a="openEx" data-id="${it.exId}">${thumb(e)}<span>${esc(e.name)}<small class="exprog ${complete ? 'ok' : ''}">${complete ? uiIcon('check') + ' Completado' : `${nd}/${it.sets.length} series`}${prJ >= 0 ? ` · <em class="prtag">${uiIcon('award')} Récord</em>` : ''}</small></span></b>
      <button class="icon dots" data-a="exMenu" data-i="${i}" aria-label="Opciones del ejercicio">⋮</button></div>
    <div class="row" style="flex-wrap:wrap;gap:8px;margin-top:4px">${restStepper('restStep', i, it.rest)}
      <button class="restchip" data-a="noteOpen" data-id="${it.exId}">${uiIcon('note')} Nota</button></div>

// Lector de texto (Tesseract.js): se descarga solo la primera vez que se usa (~5 MB con el idioma).
const loadOcr = () => window.Tesseract ? Promise.resolve() : new Promise((ok, ko) => {
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  s.onload = ok; s.onerror = ko; document.head.append(s);
});
async function ocrImport(files) {
  const msg = t => { const el = $('#ocrMsg'); if (el) el.textContent = t; };
  try {
    msg('Preparando el lector de texto… (la primera vez tarda un poco)');
    await loadOcr();
    const worker = await Tesseract.createWorker('spa');
    let text = '';
    for (const [i, f] of files.entries()) { msg(`Leyendo captura ${i + 1} de ${files.length}…`); text += (await worker.recognize(f)).data.text + '\n'; }
    await worker.terminate();
    $('#impText').value = text.trim();
    const r = parseRoutine(text);
    if (!r.rows.length) return msg('No he encontrado ejercicios en las capturas. Abajo tienes el texto leído: puedes corregirlo y pulsar "Leer rutina".');
    imp = r; render();
  } catch { msg('No se pudo leer la imagen. Comprueba la conexión (la primera vez hace falta internet) y vuelve a probar.'); }
}
async function importData(file) {
  try {
    const d = JSON.parse(await file.text());
    if (!Array.isArray(d.workouts) || !Array.isArray(d.routines)) throw 0;
    if (!(await confirmForja('Importar copia de seguridad', `La copia contiene ${d.workouts.length} entrenos y reemplazará los datos actuales.`, { danger: true, accept: 'Reemplazar datos', icon: 'cloud' }))) return;
    S = { ...defaults(), ...d }; save(); toast('Datos importados'); render();
  } catch { toast('Ese archivo no es una copia válida'); }
}

  press = { x: e.clientX, y: e.clientY, t: setTimeout(() => startDrag(h.dataset.drag, +h.dataset.i, press.y), 400) };
});
document.addEventListener('pointermove', e => {
  if (drag) return moveDrag(e.clientY);
  if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10) { clearTimeout(press.t); press = null; } // es un scroll
});
const endPress = () => { if (press) clearTimeout(press.t); press = null; if (drag) endDrag(); };
document.addEventListener('pointerup', endPress);
document.addEventListener('pointercancel', endPress);
document.addEventListener('touchmove', e => { if (drag || sw?.on) e.preventDefault(); }, { passive: false }); // que no haga scroll mientras arrastras

// --- deslizar una serie a la izquierda para borrarla (se pone roja al pasar el 35 %) ---
let sw = null;
document.addEventListener('pointerdown', e => { const row = e.target.closest('.set[data-si]'); if (row && !drag) sw = { row, x: e.clientX, y: e.clientY, dx: 0, on: false }; });
document.addEventListener('pointermove', e => {
  if (!sw) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (!sw.on) {
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { sw = null; return; } // es un scroll vertical
    if (dx > -10 || Math.abs(dx) < Math.abs(dy)) return;
    sw.on = true; sw.row.parentElement.classList.add('swiping'); sw.row.style.transition = 'none';
  }
  sw.dx = Math.min(0, dx);
  sw.row.style.transform = `translateX(${sw.dx}px)`;
  sw.row.parentElement.classList.toggle('armed', -sw.dx > sw.row.offsetWidth * .35);
});
function swEnd() {
  if (!sw) return;
  const { row, dx, on } = sw; sw = null;
  if (!on) return;
  swallowClick = true; setTimeout(() => swallowClick = false, 350); // que no marque ✓ ni abra menús al soltar
  row.style.transition = 'transform .2s ease';
  if (-dx > row.offsetWidth * .35) {
    row.style.transform = 'translateX(-100%)'; navigator.vibrate?.(15);
    setTimeout(() => { S.active.items[row.dataset.si].sets.splice(row.dataset.sj, 1); save(); render(); toast('Serie borrada'); }, 200);
  } else { row.style.transform = ''; row.parentElement.classList.remove('armed', 'swiping'); }
}
document.addEventListener('pointerup', swEnd);
document.addEventListener('pointercancel', swEnd);

// --- deslizar hacia abajo desde arriba del todo para recargar (en la app instalada no hay botón de recargar) ---
const PULL = 70, ptr = $('#ptr');
let pull = null;
// Refresco sin recargar la página (recargar hacía parpadear todo): trae la nube, busca versión nueva
// y vuelve a pintar con un fundido. Si hay versión nueva, el service worker recarga una vez para instalarla.
async function softRefresh() {
  const t0 = Date.now();
  try { await Promise.all([sync(), navigator.serviceWorker?.getRegistration().then(r => r?.update())]); } catch {}
  await new Promise(r => setTimeout(r, Math.max(0, 650 - (Date.now() - t0)))); // que la rueda se vea girar un momento
  smooth(render);
  $('#view').scrollTo({ top: 0, behavior: 'smooth' });
  ptr.classList.remove('spin', 'ready'); ptr.style.opacity = 0;
}
const pullReset = () => { pull = null; ptr.style.transform = ''; ptr.style.opacity = 0; ptr.classList.remove('ready'); };
document.addEventListener('touchstart', e => {
  ptr.classList.remove('settle');
  if ($('#view').scrollTop > 0 || e.touches.length > 1 || drag || menu || wheel || picker || !$('#reorder').hidden) return;
  pull = { y: e.touches[0].clientY, d: 0 };
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!pull) return;
  if (drag || sw?.on) return pullReset(); // está reordenando o borrando una serie
  const d = e.touches[0].clientY - pull.y;
  if (d <= 0 || $('#view').scrollTop > 0) { pull.d = 0; ptr.style.transform = ''; ptr.style.opacity = 0; return; }
  pull.d = Math.min(d * .5, 110);
  ptr.style.transform = `translate(-50%, ${pull.d}px) rotate(${pull.d * 3}deg)`;
  ptr.style.opacity = Math.min(1, pull.d / PULL);
  ptr.classList.toggle('ready', pull.d > PULL);
}, { passive: true });
document.addEventListener('touchend', () => {
  if (!pull) return;
  ptr.classList.add('settle'); // al soltar, la rueda vuelve a su sitio deslizándose
  if (pull.d > PULL) { pull = null; ptr.style.transform = ''; ptr.classList.add('spin'); softRefresh(); }
  else pullReset();
});
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-drag]')) e.preventDefault(); });
function startDrag(mode, from, y) {
  press = null; navigator.vibrate?.(25);
  const list = dragList(mode), n = list.length;
  const top = Math.max(70, Math.min(y - from * ROW - ROW / 2, innerHeight - n * ROW - 90));
  const el = $('#reorder');
  el.innerHTML = `<div class="ro-list" style="top:${top}px">${list.map((it, k) =>
    `<div class="ro-row" style="transform:translateY(${k * ROW}px)"><span class="grip">⠿</span>${thumb(ex(it.exId))}${esc(ex(it.exId).name)}</div>`).join('')}</div>`;
  el.hidden = false;
  drag = { mode, from, to: from, top, n, rows: [...el.querySelectorAll('.ro-row')] };
  drag.rows[from].classList.add('lift');
  moveDrag(y);
}
function moveDrag(y) {
  const d = drag, pos = Math.max(0, Math.min(y - d.top - ROW / 2, (d.n - 1) * ROW));
  d.to = Math.round(pos / ROW);
  d.rows.forEach((r, k) => {
    const slot = k === d.from ? null : k > d.from && k <= d.to ? k - 1 : k < d.from && k >= d.to ? k + 1 : k;
    r.style.transform = slot === null ? `translateY(${pos}px) scale(1.03)` : `translateY(${slot * ROW}px)`;
  });
}
function endDrag() {
  const { mode, from, to } = drag, list = dragList(mode);
  drag = null; swallowClick = true; setTimeout(() => swallowClick = false, 350);
  $('#reorder').hidden = true;
  list.splice(to, 0, list.splice(from, 1)[0]);
  if (mode === 'workout') save();
  render();
}

document.addEventListener('click', e => {
  if (swallowClick) { swallowClick = false; return; } // el clic que sigue a soltar el arrastre
  const el = e.target.closest('[data-a],[data-tab]'); if (!el || el.disabled) return;
  if (el.dataset.tab) { picker = null; go(el.dataset.tab); return; }
  A[el.dataset.a]?.(el.dataset, el);
});
document.addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (d.f) {
    const s = S.active.items[d.i].sets[d.j], v = t.value.replace(',', '.').trim();
    s[d.f] = v === '' || isNaN(v) ? '' : Number(v); save(); updStats();
  } else if (d.w) { S.active[d.w] = t.value; save(); }
  else if (d.d) draft[d.d] = t.value;
  else if (d.rr) draft.items[d.rr].reps = t.value.trim();
  else if ('impname' in d) imp.name = t.value;
  else if (d.note) { S.notes[d.note] = t.value; save(); }
  else if (d.plate) { P[d.plate] = t.value; $('#plateOut').innerHTML = plateOut(); }
  else if (d.search) {
    F[d.search].q = t.value;
    if (d.search === 'pick' && picker === 'replace') {
      $('#pickRecommendations').hidden = !!t.value.trim();
      $('#pickList').hidden = !t.value.trim();
      $('#pickList').innerHTML = t.value.trim() ? exList('pick', S.active?.items?.[replaceIdx]?.exId) : '';
    } else $('#' + d.search + 'List').innerHTML = exList(d.search);
  }
});
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if (d.imp) { imp.rows[d.imp].pick = t.value; render(); }
  else if (d.hist) { H.ex[d.hist].pick = t.value; render(); }
  else if ('platebar' in d) { P.bar = t.value; $('#plateOut').innerHTML = plateOut(); }
  else if (t.id === 'hevyCsv' && t.files[0]) readHevyCsv(t.files[0]);
  else if (t.id === 'photoFile' && t.files[0]) setPhoto(t.files[0]).catch(() => toast('No se pudo usar esa imagen'));
  else if (d.setting) { S.rest = +t.value; save(); }
  else if (t.id === 'importFile' && t.files[0]) importData(t.files[0]);
  else if (t.id === 'impImg' && t.files.length) ocrImport([...t.files]);
});
document.addEventListener('focusin', e => { if (e.target.dataset.f) e.target.select(); });

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js');
  navigator.serviceWorker.addEventListener('controllerchange', () => location.reload()); // versión nueva instalada
}
// Teclado abierto = el área visible es bastante más baja que la ventana.
function fitViewport() { const vv = window.visualViewport; if (vv) document.body.classList.toggle('kb', innerHeight - vv.height > 120); }
window.visualViewport?.addEventListener('resize', fitViewport);
document.addEventListener('focusout', () => setTimeout(() => { // al cerrar el teclado iOS a veces deja la página descolocada
  fitViewport();
  if (!document.activeElement?.matches('input, textarea, select')) scrollTo(0, 0); // la ventana nunca debe quedar desplazada
}, 80));
// Puntos de los recuadros deslizables: marcan la vista visible.
document.addEventListener('scroll', e => {
  const sl = e.target; if (!sl.classList?.contains('mslides')) return;
  const k = Math.round(sl.scrollLeft / sl.clientWidth);
  sl.nextElementSibling?.querySelectorAll('i').forEach((d, j) => d.classList.toggle('on', j === k));
}, true);
render();
// Muñeco 3D: se carga aparte; al estar listo se repinta para cambiar el muñeco plano por el 3D.
window.onFig3d = () => render();
FIG3D.start();
sync(); // al abrir: trae lo de otros dispositivos y sube lo de este
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });
</script>
</body>
