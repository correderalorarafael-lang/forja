<html lang="es">
<head>

<title>Forja</title>
<link rel="manifest" href="manifest.json">

<style>

body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:calc(140px + env(safe-area-inset-bottom))}

main{max-width:640px;margin:0 auto;padding:12px 16px}
button,input,select{font:inherit;color:inherit}
.btn{background:var(--acc);color:#111;border:0;border-radius:12px;padding:12px 16px;font-weight:700;cursor:pointer}
.btn.big{width:100%;padding:18px;font-size:18px}.btn.wide{width:100%;margin-top:10px}
.btn.ghost{background:var(--card);color:var(--txt);border:1px solid var(--line)}

.tap{cursor:pointer}.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}
.muted{color:var(--mut);margin:6px 0}small{color:var(--mut)}
.stats{display:flex;gap:12px}.stats>div{flex:1;display:flex;flex-direction:column}.stats b{font-size:18px}
.mini{display:flex;gap:14px;color:var(--mut);font-size:14px;margin-top:4px}

.exname{color:var(--acc);cursor:pointer}

.bar{height:10px;background:var(--bg);border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);border-radius:999px}
.restchip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:8px 14px;margin-top:6px;font-size:14px;cursor:pointer;color:var(--txt)}
#wheel{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}#wheel[hidden]{display:none}
#wheel .in{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:22px 22px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));text-align:center;animation:sheetup .3s cubic-bezier(.2,.9,.25,1)}
@keyframes sheetup{from{transform:translateY(100%)}}
.handle{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.wheel{position:relative;height:220px;margin:14px 0 8px;perspective:500px}
.wsel{position:absolute;left:0;right:0;top:88px;height:44px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.wlist{position:relative;height:220px;overflow-y:scroll;scroll-snap-type:y mandatory;padding:88px 0;scrollbar-width:none;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent)}

.wi{height:44px;display:grid;place-items:center;scroll-snap-align:center;font-size:22px;font-variant-numeric:tabular-nums;cursor:pointer;color:var(--mut)}
.wi.on{color:var(--acc);font-weight:700}
.sh,.set{display:grid;grid-template-columns:32px minmax(0,1fr) 58px 50px 38px 40px;gap:5px;align-items:center;text-align:center}
.prev{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rpe{height:38px;border-radius:10px;border:0;background:var(--bg);color:var(--mut);font-size:15px;cursor:pointer;padding:0}
.rpe.on{color:var(--acc);font-weight:800}.set.done .rpe{background:transparent}
.dots{font-size:24px;line-height:1;padding:4px 10px}
.noterow{display:flex;gap:8px;align-items:center;margin-top:6px}.noterow .note{flex:1;margin:0}
#menu{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}#menu[hidden]{display:none}
#menu .in{background:var(--card);width:100%;max-width:640px;margin:0 auto;border-radius:22px 22px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));animation:sheetup .3s cubic-bezier(.2,.9,.25,1);max-height:85vh;overflow-y:auto}
#menu h3{text-align:center;margin:4px 0 12px}
.mi{display:flex;gap:14px;align-items:center;width:100%;background:var(--bg);border:0;border-bottom:1px solid var(--line);padding:15px 16px;font-size:17px;text-align:left;color:var(--txt);cursor:pointer}
#menuBody>.mi:first-child{border-radius:14px 14px 0 0}#menuBody>.mi:last-of-type{border-radius:0 0 14px 14px;border-bottom:0}
.mi span{width:26px;text-align:center;flex:none}.mi.danger{color:var(--bad)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 14px;text-align:left;font-size:16px;font-weight:600;cursor:pointer;color:var(--txt)}
.folder{margin:6px 0 14px}
.fhead{background:none;border:0;color:var(--mut);font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:10px 0;cursor:pointer;text-align:left}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.avatar{width:84px;height:84px;border-radius:50%;border:2px solid var(--line);background:var(--bg);font-size:36px;flex:none;overflow:hidden;padding:0;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;margin-top:12px}
.day{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;font-size:15px;border:0;background:none;color:var(--txt)}
.day.on{background:var(--acc);color:#111;font-weight:800;cursor:pointer}.day.today{outline:2px solid var(--acc)}
.rpegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.rpegrid .chip{padding:12px;font-size:17px}
.sh{font-size:12px;color:var(--mut);margin:10px 0 4px}
.setwrap{position:relative;border-radius:10px;overflow:hidden;margin:2px 0}
.swbg{position:absolute;inset:0;background:#6e2424;color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:18px;font-weight:700;transition:background .15s}
.setwrap.armed .swbg{background:var(--bad)}
.set{position:relative;padding:4px 0;border-radius:10px;background:var(--card);touch-action:pan-y}.set.done{background:#1e342c}
.set input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 4px;text-align:center}
.set.done input{border-color:transparent;background:transparent}
.prev{background:none;border:0;color:var(--mut);font-size:14px;cursor:pointer}
.chk{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--mut);font-weight:900;cursor:pointer}
.set.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.n{color:var(--mut);font-weight:700}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap;cursor:pointer;font-size:14px}
.chip.on{background:var(--acc);color:#111;border-color:var(--acc)}
.li{display:flex;justify-content:space-between;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px;text-align:left;cursor:pointer}
nav{view-transition-name:barra;position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0 12px;font-size:12px;cursor:pointer}
nav button b{display:block;font-size:20px}nav button.on{color:var(--acc)}
#rest{view-transition-name:descanso;position:fixed;left:8px;right:8px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:7;max-width:624px;margin:0 auto;background:rgba(38,41,47,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.45);transform:translateY(160%);opacity:0;visibility:hidden;pointer-events:none;transition:transform .35s cubic-bezier(.2,.9,.25,1),opacity .25s,visibility 0s .35s}
#rest.show{transform:none;opacity:1;visibility:visible;pointer-events:auto;transition-delay:0s}
.ring{width:48px;height:48px;transform:rotate(-90deg);flex:none}.ring circle{fill:none;stroke-width:4.5}
.ring .trk{stroke:var(--line)}#restring{stroke:var(--acc);stroke-linecap:round;stroke-dasharray:119.38}
.rinfo{flex:1;display:flex;flex-direction:column;line-height:1.1}
#restclock{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
#banner[hidden],#sheet[hidden],#reorder[hidden]{display:none}
.chk{transition:transform .15s}.set.done .chk{animation:pop .25s}
@keyframes pop{50%{transform:scale(1.15)}}
#reorder{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.55);touch-action:none}
.ro-list{position:absolute;left:16px;right:16px;max-width:608px;margin:0 auto}
.ro-row{position:absolute;left:0;right:0;height:50px;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;font-weight:600;transition:transform .2s cubic-bezier(.2,.9,.25,1)}
.ro-row.lift{transition:none;z-index:2;border-color:var(--acc);box-shadow:0 12px 28px rgba(0,0,0,.5)}
.demo{position:relative;aspect-ratio:4/3;background:#fff;border-radius:16px;overflow:hidden;margin:10px 0}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.demo img+img{animation:swap 2.6s ease-in-out infinite}
@keyframes swap{0%,35%{opacity:0}50%,85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.demo img+img{animation:none;opacity:0}}
.how{margin:8px 0 0;padding-left:22px}.how li{margin:6px 0}
.tip{background:rgba(255,122,26,.1);border-radius:10px;padding:10px;margin:10px 0 0}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{border-radius:999px;padding:5px 12px;font-size:14px;background:var(--bg);border:1px solid var(--line)}
.tag.main{background:var(--acc);color:#111;border-color:var(--acc);font-weight:700}
.li{align-items:center;gap:12px}.li span{flex:1}
h3{margin:0;font-size:16px}
button.n{background:none;border:0;padding:8px 0;cursor:pointer;font:inherit;font-weight:800;color:var(--mut)}
.t-w{color:#f5c518!important}.t-f{color:var(--bad)!important}.t-d{color:#a78bfa!important}
.card.ss{border-left:4px solid #a78bfa}.sslabel{display:block;color:#a78bfa;font-weight:700;margin-bottom:6px}.li.ssli{border-left:3px solid #a78bfa;padding-left:8px}
.note{width:100%;background:transparent;border:0;border-bottom:1px dashed var(--line);color:var(--mut);padding:8px 2px;margin:6px 0 2px;font-size:14px}
.note:focus{outline:none;border-bottom-color:var(--acc);color:var(--txt)}
.plates{display:flex;align-items:center;gap:3px;min-height:140px;overflow-x:auto;padding:6px 0}
.barend{width:46px;height:12px;background:#8a8f98;border-radius:3px;flex:none}
.plate{width:24px;border-radius:5px;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none;writing-mode:vertical-rl;transform:rotate(180deg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
#banner{display:block;width:100%;background:var(--acc);color:#111;border:0;font-weight:700;padding:10px;cursor:pointer}
#sheet{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
#sheet .in{background:var(--bg);width:100%;max-width:640px;margin:0 auto;height:88vh;border-radius:18px 18px 0 0;padding:14px 16px;display:flex;flex-direction:column}
#pickList{overflow-y:auto;flex:1}
#ptr{position:fixed;top:calc(env(safe-area-inset-top) - 40px);left:50%;width:40px;height:40px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--acc);display:grid;place-items:center;font-size:22px;font-weight:800;z-index:20;opacity:0;transform:translate(-50%,0);pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.4)}
#ptr.ready{background:var(--acc);color:#111}#ptr.spin{animation:ptrspin .6s linear infinite}
@keyframes ptrspin{from{transform:translate(-50%,110px) rotate(0)}to{transform:translate(-50%,110px) rotate(360deg)}}
#toast{position:fixed;top:calc(70px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:#26292f;border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:10;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
.chart{width:100%;height:auto;background:var(--bg);border-radius:12px}.ct{fill:var(--mut);font-size:11px}
.prog{margin:8px 0 2px;padding:8px 12px;border-radius:10px;background:var(--bg);font-size:14px;color:var(--txt)}.prog.up{background:rgba(255,122,26,.15);border:1px solid var(--acc)}
.hero{text-align:center}.bigkg{font-size:44px;font-weight:900;margin:2px 0}.cmpemoji{font-size:72px;line-height:1.25;margin:6px 0}.upc{color:var(--ok)}.downc{color:var(--bad)}.mut{color:var(--mut)}
.cnt{display:flex;align-items:center;gap:6px}.cnt b{min-width:22px;text-align:center}
.field{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0}
table{width:100%;border-collapse:collapse;font-size:15px}td{padding:4px 0}td:last-child{text-align:right;color:var(--mut)}
/* iOS: con el teclado abierto lo fijado abajo flota a media pantalla; se oculta la barra y el descanso sube */
body.kb nav{display:none}
body.kb #rest{top:calc(env(safe-area-inset-top) + 64px);bottom:auto}
/* --- transiciones entre pantallas --- */
::view-transition-group(root){animation-duration:.32s;animation-timing-function:cubic-bezier(.22,.8,.24,1)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.32s;animation-timing-function:cubic-bezier(.22,.8,.24,1);mix-blend-mode:normal}
html[data-nav=fwd]::view-transition-old(root){animation-name:vt-sale-izq}
html[data-nav=fwd]::view-transition-new(root){animation-name:vt-entra-der}
html[data-nav=back]::view-transition-old(root){animation-name:vt-sale-der}
html[data-nav=back]::view-transition-new(root){animation-name:vt-entra-izq}
html[data-nav=fade]::view-transition-old(root){animation:.18s ease-out both vt-desvanece}
html[data-nav=fade]::view-transition-new(root){animation:.26s cubic-bezier(.22,.8,.24,1) both vt-aparece}
::view-transition-old(cabecera),::view-transition-new(cabecera){animation-duration:.2s}
@keyframes vt-entra-der{from{transform:translateX(100%)}}
@keyframes vt-sale-izq{to{transform:translateX(-28%);opacity:.6}}
@keyframes vt-entra-izq{from{transform:translateX(-28%);opacity:.6}}
@keyframes vt-sale-der{to{transform:translateX(100%)}}
@keyframes vt-desvanece{to{opacity:0}}
@keyframes vt-aparece{from{opacity:0;transform:translateY(10px)}}
#view.enter-fwd{animation:vt-entra-der .32s cubic-bezier(.22,.8,.24,1)}
#view.enter-back{animation:vt-entra-izq .32s cubic-bezier(.22,.8,.24,1)}
#view.enter-fade{animation:vt-aparece .26s cubic-bezier(.22,.8,.24,1)}
/* respuesta al pulsar */
button,.tap{transition:transform .14s cubic-bezier(.3,.7,.4,1),background-color .2s,opacity .2s}
button:active:not(:disabled),.tap:active{transform:scale(.97)}
.btn:active:not(:disabled){opacity:.88}
@media (prefers-reduced-motion:reduce){button,.tap{transition:none}button:active,.tap:active{transform:none}}
</style>

<body>
<header><h1 id="title"></h1><span class="row"><button class="btn sm" id="finishBtn" data-a="finishMenu" hidden>Terminar</button><button class="icon" data-tab="ajustes" aria-label="Ajustes">⚙</button></span></header>
<button id="banner" data-tab="entreno" hidden></button>
<main id="view"></main>
<div id="rest"><svg class="ring" viewBox="0 0 44 44" aria-hidden="true"><circle class="trk" cx="22" cy="22" r="19"/><circle id="restring" cx="22" cy="22" r="19"/></svg>
  <div class="rinfo"><small>Descanso</small><span id="restclock"></span></div>
  <button class="btn ghost sm" data-a="restAdj" data-d="-15">−15</button><button class="btn ghost sm" data-a="restAdj" data-d="15">+15</button><button class="btn sm" data-a="restSkip">Saltar</button></div>
<nav>
  <button data-tab="inicio"><b>🏠</b>Inicio</button>
  <button data-tab="entreno"><b>🏋</b>Entrenamiento</button>
  <button data-tab="perfil"><b>👤</b>Perfil</button>
</nav>
<div id="sheet" hidden></div>
<div id="toast"></div>
<div id="ptr" aria-hidden="true">↻</div>
<div id="reorder" hidden></div>
<div id="menu" hidden><div class="in" role="dialog" aria-labelledby="menuTitle"><div class="handle"></div><h3 id="menuTitle"></h3><div id="menuBody"></div></div></div>
<div id="wheel" hidden><div class="in" role="dialog" aria-label="Temporizador de descanso"><div class="handle"></div>
  <h3>Temporizador de descanso</h3><small id="wheelEx"></small>
  <div class="wheel"><div class="wsel"></div><div class="wlist" id="wlist" tabindex="0"></div></div>
  <button class="btn wide" data-a="wheelDone">Listo</button></div></div>
<script src="ejercicios.js"></script>
<script>
const VERSION = 24; // súbelo junto con C en sw.js
const MUSCLES =['Pecho','Espalda','Hombros','Brazos','Piernas','Core'];
const RESTS = Array.from({ length: 41 }, (_, i) => i * 15); // 0 a 10 min, de 15 en 15 s
const RING = 119.38; // perímetro del anillo de descanso (2π·19)
const TABS = ['inicio','entreno','perfil','ajustes'];
const SET_TYPES = ['', 'w', 'f', 'd']; // normal, calentamiento, fallo, drop set
const work = sets => sets.filter(s => s.t !== 'w'); // las de calentamiento no cuentan para récords
// Progresión doble: siempre entre 8 y 12 reps. Si en la última sesión todas las series de trabajo llegaron a 12,
// se sube peso y se vuelve a 8; si no, mismo peso y +1 rep por serie.
const REP_MIN = 8, REP_MAX = 12;
const stepKg = exId => /mancuerna/i.test(ex(exId).name) ? 2 : 2.5;
function progression(exId) {
  const last = work(prevSets(exId));
  if (!last.length) return null;
  const kg = Math.max(...last.map(s => +s.kg || 0)), top = last.filter(s => (+s.kg || 0) === kg);
  if (kg > 0 && top.every(s => s.reps >= REP_MAX)) {
    const next = kg + stepKg(exId);
    return { up: true, kg: next, msg: `⬆️ Sube peso: ${fmt(next)} kg × ${REP_MIN} (la última vez hiciste ${REP_MAX} en todas)` };
  }
  return { up: false, kg, msg: last.every(s => s.reps >= REP_MIN)
    ? `🎯 Mantén ${fmt(kg)} kg y suma 1 rep por serie (hasta ${REP_MAX})`
    : `🎯 Mantén ${fmt(kg)} kg hasta hacer ${REP_MIN}–${REP_MAX} en todas` };
}
// Sugerencia para la serie j del ejercicio (null en calentamiento o sin historial).
function suggest(it, j) {
  if (it.sets[j].t === 'w') return null;
  const pr = progression(it.exId); if (!pr) return null;
  const last = work(prevSets(it.exId)), k = work(it.sets.slice(0, j)).length, ref = last[Math.min(k, last.length - 1)];
  if (pr.up) return { kg: pr.kg, reps: REP_MIN };
  return { kg: +ref.kg || 0, reps: Math.min(REP_MAX, ref.reps >= REP_MIN ? ref.reps + 1 : REP_MIN) };
}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    (e.main || [e.muscle]).filter(Boolean).forEach(m => t[m] = (t[m] || 0) + n);

const STOP = new Set(['de', 'del', 'la', 'el', 'al', 'con', 'en', 'un', 'una', 'los', 'las', 'agarre', 'a', 'y', 'the', 'of', 'with', 'on', 'to', 'and']);
const SYN = { cable: 'polea', smith: 'barra', mancuerna: 'mancuernas', barbell: 'barra', dumbbell: 'mancuernas', pantorrilla: 'gemelos', acostado: 'tumbado',
  multipower: 'barra', bayesiano: 'bayesian' };
const PHRASES = [[/\b(una pierna|un brazo|una mano|(single|one)[ -](leg|arm))\b/g, 'unilateral'], [/\bdos brazos\b/g, ''], [/\bextension(es)? de piernas?\b/g, 'extension cuadriceps'], [/\bcurl de piernas?\b/g, 'curl femoral']]; // nombres de Hevy
const VARIANT = new Set(['inclinado', 'declinado', 'cerrado', 'frontal', 'sentado', 'tumbado', 'colgado', 'martillo', 'rumano', 'unilateral',
  'incline', 'decline', 'close', 'front', 'seated', 'lying', 'hammer', 'romanian', 'hanging', 'standing']); // distinguen variantes: pesan doble
const toks = s => PHRASES.reduce((t, [re, to]) => t.replace(re, to), norm(s)).replace(/[^a-z0-9ñ]+/g, ' ').split(' ').filter(w => w && !STOP.has(w)).map(w => (SYN[w] || w).replace(/(es|s)$/, ''));
function guessEx(name) {
  if (S.alias[norm(name)]) return { id: S.alias[norm(name)], score: 1 };
  const a = toks(name), sum = ws => ws.reduce((t, w) => t + (VARIANT.has(w) ? 2 : 1), 0);
  const sim = name => { const b = toks(name); return 2 * sum(a.filter(w => b.includes(w))) / (sum(a) + sum(b)); };
  return allEx().reduce((best, e) => {
    const score = Math.max(sim(e.name), e.en ? sim(e.en) : 0); // también en inglés (historial de otras apps)
    return score > best.score ? { id: e.id, score } : best;
  }, { id: null, score: 0 });
}
function parseRoutine(text) {

  // de la línea ("Ral 6 series", "af Elevación") y el descanso puede ir en la misma línea ("Imin Os").
  const SETS = /(\d+)\s*(?:series?|sets?)\b\W*(.*)$/i, REST = /(?:descansa|descanso|rest)\b/i;
  const nameish = l => !SETS.test(l) && !REST.test(l) && (l.match(/[a-záéíóúñü]/gi) || []).length >= 4 && !/^(descargar|download)$/i.test(l);
  const prevName = i => { for (let k = i - 1; k >= 0 && k >= i - 3; k--) if (nameish(lines[k])) return k; return -1; };
  const clean = l => l.replace(/^[^a-záéíóúñü]*(?:[a-z]{1,3}\b[^a-záéíóúñü]+)?/i, '').trim();
  const restOf = l => {
    const at = l.search(REST); if (at < 0) return null;
    const t = l.slice(at).replace(/^\S+/, '').replace(/[Il|]/g, '1').replace(/[Oo]/g, '0'); // OCR: "Imin Os" = 1min 0s
    const min = t.match(/(\d+)\s*min/i), sec = min ? t.slice(min.index + min[0].length).match(/(\d+)/) : t.match(/(\d+)\s*s/i);
    return (min ? +min[1] * 60 : 0) + (sec ? +sec[1] : 0);
  };
  lines.forEach((l, i) => {
    const m = l.match(SETS);
    const x = l.match(/^(.+?)\s+(\d+)\s*[x×]\s*(\d+(?:\s*-\s*\d+)?)\b/i); // "Press banca 4x8-10"
    const k = m ? prevName(i) : -1;
    if (k >= 0) {
      const rest = restOf(l) ?? restOf(lines[i + 1] || '') ?? S.rest;
      // En el móvil los nombres largos ocupan dos líneas ("Curl de Piernas Acostado" / "(Máquina)").
      // Antes del primer ejercicio va el título, así que ahí solo se une si la línea es claramente continuación.
      let s = k;
      while (s > 0 && k - s < 2 && nameish(lines[s - 1]) && (rows.length || /^\W*\(/.test(lines[s]) || /^[a-záéíóúñü]/.test(clean(lines[s])))) s--;
      if (!rows.length) { const t = prevName(s); if (t >= 0) title = clean(lines[t]); }
      rows.push({ src: [clean(lines[s]), ...lines.slice(s + 1, k + 1)].join(' '), sets: +m[1], reps: m[2].replace(/\s*(repeticiones|reps?)\b.*/i, '').replace(/[^\d-]/g, ''), rest });
    } else if (x && !m) rows.push({ src: x[1], sets: +x[2], reps: x[3].replace(/\s/g, ''), rest: S.rest });
  });

  return { name: title, rows };
}

function parseCSV(t) {
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows.filter(r => r.length > 1);
}
const MONTHS = { jan: 0, ene: 0, feb: 1, mar: 2, apr: 3, abr: 3, may: 4, jun: 5, jul: 6, aug: 7, ago: 7, sep: 8, oct: 9, nov: 10, dec: 11, dic: 11 };
function parseDateLoose(s) { // "26 Mar 2024, 18:33" o ISO
  const m = s.match(/(\d{1,2})\s+([a-zA-ZÀ-ÿ]{3})[a-zA-ZÀ-ÿ.]*\s+(\d{4}),?\s+(\d{1,2}):(\d{2})/), k = m && norm(m[2]).slice(0, 3);
  if (m && k in MONTHS) return new Date(+m[3], MONTHS[k], +m[1], +m[4], +m[5]).getTime();
  const t = Date.parse(s); return isNaN(t) ? null : t;
}

function bell(t0) {

// Une los datos del móvil (a) con los de la nube (b) sin perder nada: por id, gana el cambio más nuevo (u)
// y lo borrado en cualquiera de los dos se queda borrado. El entreno en curso nunca se sincroniza.
function mergeData(a, b) {
  const deleted = { ...b.deleted, ...a.deleted };
  const join = (la = [], lb = [], key, pre) => {
    const m = new Map(lb.map(o => [key(o), o]));
    for (const o of la) { const r = m.get(key(o)); m.set(key(o), r && (r.u || 0) > (o.u || 0) ? r : o); }
    return [...m.values()].filter(o => !deleted[pre + key(o)]);
  };
  const id = o => o.id;
  return { ...b, ...a, active: a.active, deleted,
    workouts: join(a.workouts, b.workouts, id, 'w:').sort((x, y) => y.start - x.start),

  moveEx: d => { const l = S.active.items, i = +d.i, j = i + +d.d; [l[i], l[j]] = [l[j], l[i]]; save(); $('#menuBody').innerHTML = reorderHtml(); },
  noteOpen: d => { noteOpen = d.id; render(); $('#note-' + d.id)?.focus(); },
  ssLinkR: d => { linkSS(draft.items, +d.i); render(); },
  openDiscos: () => go('discos'),
  bodyM: d => { bodyM = d.k; render(); },
  bodySave: () => {
    const e = { t: new Date(($('#bDate').value || today()) + 'T12:00').getTime() };
    for (const [k] of BODY) { const v = $('#b_' + k).value.replace(',', '.').trim(); if (v !== '' && !isNaN(v)) e[k] = +v; }
    if (Object.keys(e).length < 2) return toast('Escribe al menos una medida');
    e.u = Date.now();
    const same = S.body.find(x => x.t === e.t);
    if (same) Object.assign(same, e); else S.body.push(e);
    save(); toast('Registro guardado'); render();
  },
  bodyDel: d => { if (!confirm('¿Borrar este registro?')) return; gone('b:' + d.t); S.body = S.body.filter(x => x.t !== +d.t); save(); render(); },
  hevyCsvPick: () => $('#hevyCsv').click(),
  histSave: () => {
    const map = {};
    for (const r of H.ex) {
      let id = r.pick;
      if (id === 'new') { id = 'c' + uid(); S.custom.push({ id, name: r.src, muscle: ex(guessEx(r.src).id || '').muscle || 'Core' }); }
      map[r.src] = id; S.alias[norm(r.src)] = id;
    }
    H.ws.forEach(w => w.items.forEach(it => { it.exId = map[it.src]; delete it.src; }));
    S.workouts = [...S.workouts, ...H.ws].sort((a, b) => b.start - a.start);
    const n = H.ws.length; H = null; save(); toast(`${n} entrenos importados`); go('inicio');
  },
  restAdj: d => { const a = S.active; a.restEnd += d.d * 1000; a.restTotal = Math.max(a.restTotal, (a.restEnd - Date.now()) / 1000); save(); scheduleRest(a.restEnd > Date.now() ? a.restEnd : null); },
  restSkip: () => { S.active.restEnd = null; save(); tick(); scheduleRest(null); },
  goSub: d => go(d.p, { tab: 'perfil' }),
  notifAsk: async () => { await Notification.requestPermission(); pushSub().catch(() => {}); render(); },
  bellTest: () => alarm(),
  pMetric: d => { pMetric = d.k; render(); },
  photoPick: () => $('#photoFile').click(),
  nameEdit: () => { const n = prompt('Tu nombre', S.profile.name); if (n != null) { S.profile.name = n.trim(); save(); render(); } },
  calMove: d => { calM = new Date(calM.getFullYear(), calM.getMonth() + +d.d, 1); render(); },
  newFolder: () => { if (newFolder()) render(); },
  folderToggle: d => { const f = S.folders.find(x => x.id === d.id); f.closed = !f.closed; f.u = Date.now(); save(); render(); },
  folderMenu: d => { const f = S.folders.find(x => x.id === d.id), a = `data-id="${d.id}"`;
    openMenu(f.name, mItem('✎', 'Renombrar carpeta', 'fRename', a) + mItem('🗑', 'Eliminar carpeta', 'fDel', a, 'danger')); },
  routineMenu: d => { const r = S.routines.find(x => x.id === d.id), a = `data-id="${d.id}"`;
    openMenu(r.name, mItem('✎', 'Editar rutina', 'rEdit', a) + mItem('⧉', 'Duplicar rutina', 'rDup', a) + mItem('📁', 'Mover a carpeta', 'rMove', a)
      + mItem('🗑', 'Eliminar rutina', 'rDel', a, 'danger')); },
  finishMenu: () => openMenu('¿Terminar el entreno?', mItem('✓', 'Guardar entreno', 'save') + mItem('🗑', 'Descartar', 'discardAsk', '', 'danger')),
  finish: () => {
    const a = S.active;
    const items = a.items.map(it => ({ exId: it.exId, ...(it.ss && { ss: it.ss }),
      sets: it.sets.filter(s => s.done).map(s => ({ kg: +s.kg || 0, reps: +s.reps, ...(s.t && { t: s.t }), ...(s.rpe && { rpe: s.rpe }) })) })).filter(it => it.sets.length);
    if (!items.length) { if (confirm('No has completado ninguna serie. ¿Descartar el entreno?')) { S.active = null; save(); render(); } return; }
    const pending = a.items.reduce((n, it) => n + it.sets.filter(s => !s.done).length, 0);
    if (pending && !confirm(`Hay ${pending} series sin marcar ✓ que no se guardarán. ¿Terminar?`)) return;
    const prs = items.filter(it => { const b = bestE1rm(it.exId); return b > 0 && Math.max(0, ...work(it.sets).map(e1rm)) > b; }).map(it => ex(it.exId).name);
    const w = { id: a.id, name: a.name.trim() || 'Entreno', start: a.start, end: Date.now(), items };
    S.workouts.unshift(w); S.active = null; save(); scheduleRest(null);
    go('resumen', { id: w.id, tab: 'inicio' });
    toast(prs.length ? '🏆 ¡Nuevo récord en ' + prs.join(', ') + '!' : '💪 Entreno guardado');
  },
  openW: d => go('workout', { id: d.id }),
  openResumen: d => go('resumen', { id: d.id }),
  shareResumen: d => shareResumen(d.id, d.k),
  openEx: d => go('ejercicio', { id: d.id }),
  delW: d => { if (!confirm('¿Eliminar este entreno del historial?')) return; gone('w:' + d.id); S.workouts = S.workouts.filter(w => w.id !== d.id); save(); go('inicio'); },
  addCustom: () => {
    const name = $('#cName').value.trim();
    if (!name) return toast('Escribe un nombre');
    if (allEx().some(e => norm(e.name) === norm(name))) return toast('Ese ejercicio ya existe');
    S.custom.push({ id: 'c' + uid(), name, muscle: $('#cMuscle').value }); save(); toast('Ejercicio creado'); render();
  },
  delCustom: d => { if (!confirm('¿Eliminar este ejercicio?')) return; gone('c:' + d.id); S.custom = S.custom.filter(c => c.id !== d.id); S.routines.forEach(r => r.items = r.items.filter(it => it.exId !== d.id)); save(); go('ejercicios', { tab: 'perfil' }); },
  exportData: () => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S)], { type: 'application/json' }));
    a.download = `forja-copia-${new Date().toISOString().slice(0, 10)}.json`; a.click();
  },
  importClick: () => $('#importFile').click(),
};
// Lector de texto (Tesseract.js): se descarga solo la primera vez que se usa (~5 MB con el idioma).
const loadOcr = () => window.Tesseract ? Promise.resolve() : new Promise((ok, ko) => {
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
  s.onload = ok; s.onerror = ko; document.head.append(s);
});
async function ocrImport(files) {
  const msg = t => { const el = $('#ocrMsg'); if (el) el.textContent = t; };
  try {
    msg('Preparando el lector de texto… (la primera vez tarda un poco)');
    await loadOcr();
    const worker = await Tesseract.createWorker('spa');
    let text = '';
    for (const [i, f] of files.entries()) { msg(`Leyendo captura ${i + 1} de ${files.length}…`); text += (await worker.recognize(f)).data.text + '\n'; }
    await worker.terminate();
    $('#impText').value = text.trim();
    const r = parseRoutine(text);
    if (!r.rows.length) return msg('No he encontrado ejercicios en las capturas. Abajo tienes el texto leído: puedes corregirlo y pulsar "Leer rutina".');
    imp = r; render();
  } catch { msg('No se pudo leer la imagen. Comprueba la conexión (la primera vez hace falta internet) y vuelve a probar.'); }
}
async function importData(file) {
  try {
    const d = JSON.parse(await file.text());
    if (!Array.isArray(d.workouts) || !Array.isArray(d.routines)) throw 0;
    if (!confirm(`La copia tiene ${d.workouts.length} entrenos. Reemplazará los datos actuales. ¿Continuar?`)) return;
    S = { ...defaults(), ...d }; save(); toast('Datos importados'); render();
  } catch { toast('Ese archivo no es una copia válida'); }
}

// --- reordenar: mantener pulsado un ejercicio y arrastrarlo ---
const ROW = 58;
let drag = null, press = null, swallowClick = false;
const dragList = mode => mode === 'workout' ? S.active.items : draft.items;
document.addEventListener('pointerdown', e => {
  const h = e.target.closest('[data-drag]');
  if (!h || dragList(h.dataset.drag).length < 2) return;
  press = { x: e.clientX, y: e.clientY, t: setTimeout(() => startDrag(h.dataset.drag, +h.dataset.i, press.y), 400) };
});
document.addEventListener('pointermove', e => {
  if (drag) return moveDrag(e.clientY);
  if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10) { clearTimeout(press.t); press = null; } // es un scroll
});
const endPress = () => { if (press) clearTimeout(press.t); press = null; if (drag) endDrag(); };
document.addEventListener('pointerup', endPress);
document.addEventListener('pointercancel', endPress);
document.addEventListener('touchmove', e => { if (drag || sw?.on) e.preventDefault(); }, { passive: false }); // que no haga scroll mientras arrastras

// --- deslizar una serie a la izquierda para borrarla (se pone roja al pasar el 35 %) ---
let sw = null;
document.addEventListener('pointerdown', e => { const row = e.target.closest('.set[data-si]'); if (row && !drag) sw = { row, x: e.clientX, y: e.clientY, dx: 0, on: false }; });
document.addEventListener('pointermove', e => {
  if (!sw) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (!sw.on) {
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { sw = null; return; } // es un scroll vertical
    if (dx > -10 || Math.abs(dx) < Math.abs(dy)) return;
    sw.on = true; sw.row.style.transition = 'none';
  }
  sw.dx = Math.min(0, dx);
  sw.row.style.transform = `translateX(${sw.dx}px)`;
  sw.row.parentElement.classList.toggle('armed', -sw.dx > sw.row.offsetWidth * .35);
});
function swEnd() {
  if (!sw) return;
  const { row, dx, on } = sw; sw = null;
  if (!on) return;
  swallowClick = true; setTimeout(() => swallowClick = false, 350); // que no marque ✓ ni abra menús al soltar
  row.style.transition = 'transform .2s ease';
  if (-dx > row.offsetWidth * .35) {
    row.style.transform = 'translateX(-100%)'; navigator.vibrate?.(15);
    setTimeout(() => { S.active.items[row.dataset.si].sets.splice(row.dataset.sj, 1); save(); render(); toast('Serie borrada'); }, 200);
  } else { row.style.transform = ''; row.parentElement.classList.remove('armed'); }
}
document.addEventListener('pointerup', swEnd);
document.addEventListener('pointercancel', swEnd);

// --- deslizar hacia abajo desde arriba del todo para recargar (en la app instalada no hay botón de recargar) ---
const PULL = 70, ptr = $('#ptr');
let pull = null;
const pullReset = () => { pull = null; ptr.style.transform = ''; ptr.style.opacity = 0; ptr.classList.remove('ready'); };
document.addEventListener('touchstart', e => {
  if (scrollY > 0 || e.touches.length > 1 || drag || menu || wheel || picker || !$('#reorder').hidden) return;
  pull = { y: e.touches[0].clientY, d: 0 };
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!pull) return;
  if (drag || sw?.on) return pullReset(); // está reordenando o borrando una serie
  const d = e.touches[0].clientY - pull.y;
  if (d <= 0 || scrollY > 0) { pull.d = 0; ptr.style.transform = ''; ptr.style.opacity = 0; return; }
  pull.d = Math.min(d * .5, 110);
  ptr.style.transform = `translate(-50%, ${pull.d}px) rotate(${pull.d * 3}deg)`;
  ptr.style.opacity = Math.min(1, pull.d / PULL);
  ptr.classList.toggle('ready', pull.d > PULL);
}, { passive: true });
document.addEventListener('touchend', () => {
  if (!pull) return;
  if (pull.d > PULL) { pull = null; ptr.style.transform = ''; ptr.classList.add('spin'); setTimeout(() => location.reload(), 300); }
  else pullReset();
});
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-drag]')) e.preventDefault(); });
function startDrag(mode, from, y) {
  press = null; navigator.vibrate?.(25);
  const list = dragList(mode), n = list.length;
  const top = Math.max(70, Math.min(y - from * ROW - ROW / 2, innerHeight - n * ROW - 90));
  const el = $('#reorder');
  el.innerHTML = `<div class="ro-list" style="top:${top}px">${list.map((it, k) =>
    `<div class="ro-row" style="transform:translateY(${k * ROW}px)"><span class="grip">⠿</span>${thumb(ex(it.exId))}${esc(ex(it.exId).name)}</div>`).join('')}</div>`;
  el.hidden = false;
  drag = { mode, from, to: from, top, n, rows: [...el.querySelectorAll('.ro-row')] };
  drag.rows[from].classList.add('lift');
  moveDrag(y);
}
function moveDrag(y) {
  const d = drag, pos = Math.max(0, Math.min(y - d.top - ROW / 2, (d.n - 1) * ROW));
  d.to = Math.round(pos / ROW);
  d.rows.forEach((r, k) => {
    const slot = k === d.from ? null : k > d.from && k <= d.to ? k - 1 : k < d.from && k >= d.to ? k + 1 : k;
    r.style.transform = slot === null ? `translateY(${pos}px) scale(1.03)` : `translateY(${slot * ROW}px)`;
  });
}
function endDrag() {
  const { mode, from, to } = drag, list = dragList(mode);
  drag = null; swallowClick = true; setTimeout(() => swallowClick = false, 350);
  $('#reorder').hidden = true;
  list.splice(to, 0, list.splice(from, 1)[0]);
  if (mode === 'workout') save();
  render();
}

document.addEventListener('click', e => {
  if (swallowClick) { swallowClick = false; return; } // el clic que sigue a soltar el arrastre
  const el = e.target.closest('[data-a],[data-tab]'); if (!el || el.disabled) return;
  if (el.dataset.tab) { picker = null; go(el.dataset.tab); return; }
  A[el.dataset.a]?.(el.dataset, el);
});
document.addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (d.f) {
    const s = S.active.items[d.i].sets[d.j], v = t.value.replace(',', '.').trim();
    s[d.f] = v === '' || isNaN(v) ? '' : Number(v); save(); updStats();
  } else if (d.w) { S.active[d.w] = t.value; save(); }
  else if (d.d) draft[d.d] = t.value;
  else if (d.rr) draft.items[d.rr].reps = t.value.trim();
  else if ('impname' in d) imp.name = t.value;
  else if (d.note) { S.notes[d.note] = t.value; save(); }
  else if (d.plate) { P[d.plate] = t.value; $('#plateOut').innerHTML = plateOut(); }
  else if (d.search) { F[d.search].q = t.value; $('#' + d.search + 'List').innerHTML = exList(d.search); }
});
document.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  if (d.imp) { imp.rows[d.imp].pick = t.value; render(); }
  else if (d.hist) { H.ex[d.hist].pick = t.value; render(); }
  else if ('platebar' in d) { P.bar = t.value; $('#plateOut').innerHTML = plateOut(); }
  else if (t.id === 'hevyCsv' && t.files[0]) readHevyCsv(t.files[0]);
  else if (t.id === 'photoFile' && t.files[0]) setPhoto(t.files[0]).catch(() => toast('No se pudo usar esa imagen'));
  else if (d.setting) { S.rest = +t.value; save(); }
  else if (t.id === 'importFile' && t.files[0]) importData(t.files[0]);
  else if (t.id === 'impImg' && t.files.length) ocrImport([...t.files]);
});
document.addEventListener('focusin', e => { if (e.target.dataset.f) e.target.select(); });

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js');
  navigator.serviceWorker.addEventListener('controllerchange', () => location.reload()); // versión nueva instalada
}
// Teclado abierto = el área visible es bastante más baja que la ventana.
function fitViewport() { const vv = window.visualViewport; if (vv) document.body.classList.toggle('kb', innerHeight - vv.height > 120); }
window.visualViewport?.addEventListener('resize', fitViewport);
document.addEventListener('focusout', () => setTimeout(() => { // al cerrar el teclado iOS a veces deja la página descolocada
  fitViewport();
  if (!document.activeElement?.matches('input, textarea, select')) scrollTo(scrollX, scrollY);
}, 80));
render();
sync(); // al abrir: trae lo de otros dispositivos y sube lo de este
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });
</script>
